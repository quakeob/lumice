<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMICE — Winter Experiences</title>
  <meta name="description" content="LUMICE creates seasonal winter experiences shaped by ice, light, and place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="snowCanvas" aria-hidden="true"></canvas>

  <main>
    <section class="hero gateway" aria-labelledby="site-title">
      <div class="hero__background-wrap" data-parallax>
        <img class="hero__background" src="assets/brian-head-concept.webp" alt="Concept rendering of a snowy mountain landscape illuminated at twilight">
      </div>
      <div class="hero__content">
        <h1 class="logo" id="site-title">LUMICE</h1>
        <p class="tagline">Winter experiences shaped by ice, light, and place</p>
        <div class="hero-divider" aria-hidden="true"></div>

        <div class="gateway__projects" aria-label="Lumice projects">
          <article class="gateway__project">
            <p class="gateway__location">Southern Utah</p>
            <h2>Brian Head</h2>
            <a class="project-link" href="brian-head/">Explore Project</a>
          </article>
          <article class="gateway__project">
            <p class="gateway__location">Finnish Lapland</p>
            <h2>Finland</h2>
            <a class="project-link" href="fn/">Explore Project</a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/ambient.js"></script>
</body>
</html>
